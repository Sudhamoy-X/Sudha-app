name: Build Sudha APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android System
        run: |
          mkdir -p _backup
          cp -r lib _backup/
          cp pubspec.yaml _backup/
          flutter create --org com.sudha.browser --project-name sudha .
          rm -rf lib
          cp -r _backup/lib .
          cp _backup/pubspec.yaml .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/' android/app/build.gradle || true
          echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties

      - name: Get Packages
        run: flutter pub get

      - name: Auto-fix Proguard Issue
        run: |
          find /home/runner/.pub-cache -name "build.gradle" -exec sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" {} +

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudha-Browser-APK
          path: build/app/outputs/flutter-apk/app-release.apk
